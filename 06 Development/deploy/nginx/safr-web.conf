limit_req_zone $binary_remote_addr zone=safr_mini_app_api:10m rate=15r/s;

server {
    listen 127.0.0.1:8081;
    server_name www.safrway.online;

    return 301 https://safrway.online$request_uri;
}

server {
    listen 127.0.0.1:8081;
    server_name safrway.online;
    absolute_redirect off;
    port_in_redirect off;

    root /var/www/safr/web;
    index index.html;
    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    location ^~ /api/web/ {
        limit_req zone=safr_mini_app_api burst=20 nodelay;
        client_max_body_size 1m;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/(?!.*\.[^/]+$).+[^/]$ {
        return 301 https://safrway.online$uri/$is_args$args;
    }

    location / {
        try_files $uri/index.html =404;
    }

    location = /404.html {
        internal;
    }

    location ~* \.(?:css|js|json|png|jpg|jpeg|webp|avif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~* \.rsc$ {
        default_type text/x-component;
        try_files $uri =404;
    }
}

server {
    listen 127.0.0.1:8081;
    server_name app.safrway.online;

    root /var/www/safr/web;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self'; img-src 'self' data: https:; connect-src https://api.safrway.online; frame-ancestors https://web.telegram.org https://*.telegram.org; base-uri 'none'; form-action 'none'" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    location = / {
        try_files /mini-app/index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html /mini-app/index.html;
    }

    location ~* \.(?:css|js|json|png|jpg|jpeg|webp|avif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.rsc$ {
        default_type text/x-component;
        try_files $uri =404;
    }
}

server {
    listen 127.0.0.1:8081;
    server_name api.safrway.online;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        limit_req zone=safr_mini_app_api burst=20 nodelay;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000;
    }
}
