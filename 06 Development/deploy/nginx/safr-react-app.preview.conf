# B3 preview candidate only. Do not install before the B4 cutover gate.
#
# The app and its user-facing API are intentionally same-origin so browser
# and Telegram sessions remain host-only HttpOnly cookies.
limit_req_zone $binary_remote_addr zone=safr_mini_app_api:10m rate=15r/s;

server {
    listen 127.0.0.1:8081;
    server_name app.safrway.online;

    root /var/www/safr/react-app;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org; base-uri 'none'; form-action 'self'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    location ^~ /mini-app/ {
        limit_req zone=safr_mini_app_api burst=20 nodelay;
        client_max_body_size 1m;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /api/web/ {
        limit_req zone=safr_mini_app_api burst=20 nodelay;
        client_max_body_size 1m;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /account {
        return 307 https://app.safrway.online/account/;
    }

    location = /admin {
        return 307 https://app.safrway.online/admin/;
    }

    location = /calculator {
        return 307 https://app.safrway.online/calculator/;
    }

    location = /calculator/ {
        try_files /index.html =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /sw.js {
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /offline.html {
        default_type text/html;
        try_files $uri =404;
    }

    location = /build-version.json {
        default_type application/json;
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location ~ ^/account/(?:[A-Za-z0-9_-]+/)*$ {
        try_files /account/index.html =404;
    }

    location ~ ^/admin/(?:[A-Za-z0-9_-]+/)*$ {
        try_files /admin/index.html =404;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
