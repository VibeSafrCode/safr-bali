# SAFRWAY target production topology.
#
# Public HTML is built by Astro. Telegram Mini App and browser account are
# served by one React/Vite build on app.safrway.online. FastAPI is the only
# business/API layer and remains private on 127.0.0.1:8000.
limit_req_zone $binary_remote_addr zone=safr_public_support_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=safr_application_api:10m rate=15r/s;

# Keep cache policy at server level: location add_header would drop security headers.
map "$status:$uri" $safr_public_cache {
    default "no-cache";
    ~^[45] "no-store";
    ~^[0-9]+:/api/ "no-store";
    ~^200:/_astro/ "public, max-age=31536000, immutable";
    ~^200:.*\.(?:png|jpg|jpeg|webp|avif|ico|svg|woff2?)$ "public, max-age=3600";
}
map "$status:$uri" $safr_app_cache {
    default "no-store, no-cache, must-revalidate";
    ~^200:/(?:offline\.html|manifest\.webmanifest)$ "public, max-age=0, must-revalidate";
    ~^200:/assets/pwa/ "public, max-age=0, must-revalidate";
    ~^200:/assets/[^/]+-[A-Za-z0-9_-]+\.(?:js|css)$ "public, max-age=31536000, immutable";
    ~^200:/assets/ "public, max-age=3600";
}

server {
    listen 127.0.0.1:8081;
    server_name www.safrway.online;

    return 301 https://safrway.online$request_uri;
}

server {
    listen 127.0.0.1:8081;
    server_name safrway.online;

    # Only the local authenticated tunnel connector reaches this listener.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    root /var/www/safr/astro-site;
    index index.html;
    error_page 404 /404.html;

    add_header Cache-Control $safr_public_cache always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location = /account {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000/api/web/account-redirect;
    }

    location = /account/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000/api/web/account-redirect;
    }

    location = /api/web/auth/me {
        limit_req zone=safr_application_api burst=20 nodelay;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api/web/auth/start {
        limit_req zone=safr_application_api burst=5 nodelay;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api/web/account-redirect {
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api/web/chat/guest {
        limit_req zone=safr_public_support_api burst=5 nodelay;
        client_max_body_size 32k;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /api/catalog/ {
        limit_req zone=safr_application_api burst=20 nodelay;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /catalog {
        return 308 https://safrway.online/$is_args$args;
    }

    location = /catalog/ {
        return 308 https://safrway.online/$is_args$args;
    }

    location = /directions {
        return 308 https://safrway.online/$is_args$args;
    }

    location = /directions/ {
        return 308 https://safrway.online/$is_args$args;
    }

    location ~ ^/directions/(.+)/$ {
        return 308 https://safrway.online/$1/$is_args$args;
    }

    location ~ ^/directions/(.+[^/])$ {
        return 308 https://safrway.online/$1/$is_args$args;
    }

    location ~ ^/(?!.*\.[^/]+$).+[^/]$ {
        return 301 https://safrway.online$uri/$is_args$args;
    }

    location = /404.html {
        internal;
    }

    location ~* \.(?:css|js|json|xml|txt|png|jpg|jpeg|webp|avif|ico|svg|woff2?)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 127.0.0.1:8081;
    server_name app.safrway.online;

    # Do not broaden this trust or expose the origin listener publicly.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    root /var/www/safr/react-app;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org; base-uri 'none'; form-action 'self'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control $safr_app_cache always;

    location ^~ /mini-app/ {
        limit_req zone=safr_application_api burst=20 nodelay;
        client_max_body_size 1m;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /api/web/ {
        limit_req zone=safr_application_api burst=20 nodelay;
        client_max_body_size 1m;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /api/catalog/ {
        limit_req zone=safr_application_api burst=20 nodelay;
        client_max_body_size 1m;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /account {
        return 307 https://app.safrway.online/account/;
    }

    location = /admin {
        return 307 https://app.safrway.online/admin/;
    }

    location = /calculator {
        return 307 https://app.safrway.online/calculator/;
    }

    location = /calculator/ {
        try_files /index.html =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /sw.js {
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /offline.html {
        default_type text/html;
        try_files $uri =404;
    }

    location = /build-version.json {
        default_type application/json;
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location ~ ^/account/(?:[A-Za-z0-9_-]+/)*$ {
        try_files /account/index.html =404;
    }

    location ~ ^/admin/(?:[A-Za-z0-9_-]+/)*$ {
        try_files /admin/index.html =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

server {
    listen 127.0.0.1:8081;
    server_name api.safrway.online;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        limit_req zone=safr_application_api burst=20 nodelay;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000;
    }
}
