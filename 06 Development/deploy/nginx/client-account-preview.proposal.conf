# Insert inside app.safrway.online server BEFORE generic /account/ regex.
# This is an integration snippet, not an activated configuration.
# Preserve all server security headers explicitly: any location add_header
# overrides inheritance on common Nginx versions.
location ^~ /account/preview/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
    try_files /account/index.html =404;
}
# Confirm no upstream proxy independently sends X-Frame-Options: DENY or a
# conflicting frame-ancestors policy. Ordinary /account/ and /admin/ unchanged.
