# B4 preview candidate only. Do not install before explicit preview approval.
#
# Root/public site and React application remain separate origins. The source
# account URL performs one temporary redirect; permanent 308 is deliberately
# not configured.
limit_req_zone $binary_remote_addr zone=safr_public_support_api:10m rate=5r/s;

server {
    listen 127.0.0.1:8081;
    server_name www.safrway.online;

    return 307 https://safrway.online$request_uri;
}

server {
    listen 127.0.0.1:8081;
    server_name safrway.online;

    root /var/www/safr/astro-site;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location = /account {
        proxy_pass http://127.0.0.1:8000/api/web/account-redirect;
    }

    location = /account/ {
        proxy_pass http://127.0.0.1:8000/api/web/account-redirect;
    }

    location = /api/web/chat/guest {
        limit_req zone=safr_public_support_api burst=5 nodelay;
        client_max_body_size 32k;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /catalog {
        return 308 https://safrway.online/$is_args$args;
    }

    location = /catalog/ {
        return 308 https://safrway.online/$is_args$args;
    }

    location = /directions {
        return 308 https://safrway.online/$is_args$args;
    }

    location = /directions/ {
        return 308 https://safrway.online/$is_args$args;
    }

    location ~ ^/directions/(.+)/$ {
        return 308 https://safrway.online/$1/$is_args$args;
    }

    location ~ ^/directions/(.+[^/])$ {
        return 308 https://safrway.online/$1/$is_args$args;
    }

    location = /404.html {
        internal;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}

server {
    listen 127.0.0.1:8081;
    server_name api.safrway.online;

    client_max_body_size 1m;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://127.0.0.1:8000;
}
