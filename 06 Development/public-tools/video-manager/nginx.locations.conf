# Insert only inside the existing safrway.online origin server.
# Separate static release; never change the Main Astro or application roots.
# Inherits the existing CSP, nosniff, referrer and permissions headers.
location = /tools/video-manager {
    return 308 https://safrway.online/tools/video-manager/;
}
location = /tools/video-manager/ {
    root /var/www/safr/video-manager;
    try_files /index.html =404;
    default_type text/html;
    expires -1;
    limit_except GET HEAD { deny all; }
}
location = /tools/video-manager/privacy {
    return 308 https://safrway.online/tools/video-manager/privacy/;
}
location = /tools/video-manager/privacy/ {
    root /var/www/safr/video-manager;
    try_files /privacy/index.html =404;
    default_type text/html;
    expires -1;
    limit_except GET HEAD { deny all; }
}
location = /tools/video-manager/site.css {
    alias /var/www/safr/video-manager/site.css;
    default_type text/css;
    expires -1;
    limit_except GET HEAD { deny all; }
}
