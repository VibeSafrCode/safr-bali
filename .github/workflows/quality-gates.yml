name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bot:
    name: Bot contracts (no customer messages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "06 Development/bot"
    env:
      BOT_TOKEN: 123456:ci-token
      ADMIN_CHAT_ID: "1"
      BACKEND_API_URL: http://127.0.0.1:9
      BACKEND_SERVICE_TOKEN: ci-service-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "06 Development/bot/requirements.txt"
      - name: Install bot dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated bot regression tests
        run: python -m unittest discover -s tests -v

  backend-postgres:
    name: Backend and PostgreSQL invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: safr_ci
          POSTGRES_PASSWORD: safr_ci
          POSTGRES_DB: safr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safr_ci -d safr_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: "06 Development/backend"
    env:
      ENVIRONMENT: test
      DEBUG: "false"
      SQL_ECHO: "false"
      DATABASE_URL: postgresql+psycopg://safr_ci:safr_ci@127.0.0.1:5432/safr_ci
      SAFR_TEST_POSTGRES_URL: postgresql+psycopg://safr_ci:safr_ci@127.0.0.1:5432/safr_ci
      SERVICE_API_TOKEN: ci-service-token
      ADMIN_API_TOKEN: ci-admin-token
      TELEGRAM_BOT_TOKEN: 123456:ci-token
      TELEGRAM_BOT_USERNAME: safr_ci_bot
      DEFAULT_ADMIN_TELEGRAM_ID: "1"
      MINI_APP_ORIGINS: https://app.safrway.online
      WEBSITE_URL: https://safrway.online
      APPLICATION_URL: https://app.safrway.online
      MINI_APP_COOKIE_SECURE: "true"
      WEB_COOKIE_SECURE: "true"
      BALI_TEST_POSTGRES_BIN: /usr/lib/postgresql/16/bin
      BALI_TEST_NGINX_BIN: /usr/sbin/nginx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "06 Development/backend/requirements.txt"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest==8.3.5
      - name: Install owned-cluster readiness test tools
        run: |
          if [ ! -x "$BALI_TEST_POSTGRES_BIN/pg_ctl" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-16
          fi
          test -x "$BALI_TEST_POSTGRES_BIN/initdb"
          test -x "$BALI_TEST_POSTGRES_BIN/pg_ctl"
      - name: Verify and apply migrations to CI PostgreSQL
        run: |
          test "$(python -m alembic heads | wc -l | tr -d ' ')" = "1"
          python -m alembic upgrade head
      - name: Install isolated proxy-boundary test tools
        run: |
          if [ ! -x "$BALI_TEST_NGINX_BIN" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends nginx
          fi
          test -x "$BALI_TEST_NGINX_BIN"
          "$BALI_TEST_NGINX_BIN" -V 2>&1 | grep -q -- '--with-http_realip_module'
      - name: Run backend tests including PostgreSQL races
        run: python -m pytest -q

  target-frontends:
    name: Astro, React and ecosystem contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "06 Development"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Current pinned LTS: stable glob and upstream dependency-warning semantics.
          node-version: "24.19.0"
      # Install through the official action; never bypass Corepack signatures.
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
          run_install: false
      - name: Verify pinned frontend toolchain
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(pnpm --version)" = "11.9.0"
      - name: Install target frontend dependencies
        run: |
          pnpm --dir react-app install --frozen-lockfile
          pnpm --dir astro-site install --frozen-lockfile
      - name: Validate shared contracts
        run: |
          pnpm --dir shared validate
          pnpm --dir shared test
      - name: Test React application contract
        run: pnpm --dir react-app test
      - name: Test Astro public contract
        run: pnpm --dir astro-site test
      - name: Install CI Chromium
        run: pnpm --dir astro-site exec playwright install --with-deps chromium
      - name: Export CI Chromium path
        run: |
          echo "CHROME_PATH=$(cd astro-site && node -e 'console.log(require("@playwright/test").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Test browser navigation and accessibility
        run: |
          pnpm --dir react-app test:browser
          pnpm --dir astro-site test:browser
      - name: Test Lighthouse budgets
        run: pnpm --dir astro-site test:lighthouse
      - name: Preserve frontend verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-verification-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            06 Development/react-app/test-results/
            06 Development/astro-site/test-results/
            06 Development/astro-site/.lighthouseci/

  reference-next-vinext:
    name: Next and Vinext reference parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public build constants, not credentials. The validator must stay enabled.
      NEXT_PUBLIC_SITE_URL: https://safrway.online
      NEXT_PUBLIC_API_BASE_URL: https://api.safrway.online
    defaults:
      run:
        working-directory: "06 Development/web"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
          run_install: false
      - name: Verify pinned frontend toolchain
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(pnpm --version)" = "11.9.0"
      - name: Install reference dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Next and Vinext parity gates
        run: pnpm test
