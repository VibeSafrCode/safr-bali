name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Dependency inventory and redacted secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.9.0
          run_install: false
      - name: Scan tracked source for credentials
        run: |
          mkdir -p "$RUNNER_TEMP/security/source" "$RUNNER_TEMP/security/reports"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/security/source"
          curl -fsSL --retry 2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o "$RUNNER_TEMP/security/gitleaks.tgz"
          printf '%s  %s\n' '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e' "$RUNNER_TEMP/security/gitleaks.tgz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/security/gitleaks.tgz" -C "$RUNNER_TEMP/security" gitleaks
          cd "$RUNNER_TEMP/security/source"
          "$RUNNER_TEMP/security/gitleaks" dir . --config .gitleaks.toml --redact=100 --no-banner --report-format=json --report-path="$RUNNER_TEMP/security/reports/secrets.json"
      - name: Scan locked Python dependencies and export SBOMs
        continue-on-error: true
        run: |
          python -m pip install pip-audit==2.10.1
          result=0
          for component in backend bot yoga-bot; do
            python -m pip_audit --require-hashes -r "06 Development/$component/requirements.lock.txt" --format cyclonedx-json --output "$RUNNER_TEMP/security/reports/$component.cdx.json" || result=1
          done
          exit "$result"
      - name: Scan locked frontend and reference dependencies
        continue-on-error: true
        run: |
          result=0
          for component in astro-site react-app web; do
            pnpm --dir "06 Development/$component" audit --json > "$RUNNER_TEMP/security/reports/$component.npm.json" || result=1
          done
          exit "$result"
      - name: Preserve audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-reports
          path: ${{ runner.temp }}/security/reports/
          retention-days: 14
  bot:
    name: Bot contracts (no customer messages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "06 Development/bot"
    env:
      BOT_TOKEN: 123456:ci-token
      ADMIN_CHAT_ID: "1"
      BACKEND_API_URL: http://127.0.0.1:9
      BACKEND_SERVICE_TOKEN: ci-service-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            06 Development/bot/requirements.lock.txt
            06 Development/yoga-bot/requirements.lock.txt
      - name: Install bot dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock.txt
          python -m pip install pytest==8.3.5
          python -m pip check
      - name: Run isolated bot regression tests
        run: |
          python -m unittest discover -s tests -v
          python -m pytest -q tests/test_onboarding.py tests/test_d1_d2_summaries.py tests/test_d12_e28a_summaries.py tests/test_e33g_next_links.py
      - name: Verify isolated Yoga bot without Telegram or credentials
        working-directory: "06 Development/yoga-bot"
        run: |
          python -m venv "$RUNNER_TEMP/yoga-test-venv"
          "$RUNNER_TEMP/yoga-test-venv/bin/python" -m pip install --require-hashes -r requirements.lock.txt
          "$RUNNER_TEMP/yoga-test-venv/bin/python" -m pip check
          "$RUNNER_TEMP/yoga-test-venv/bin/python" -m unittest discover -s tests -v
          "$RUNNER_TEMP/yoga-test-venv/bin/python" -m yoga_bot.check_catalog --shared-root ../shared/content --site-origin https://yoga.example.org

  backend-postgres:
    name: Backend and PostgreSQL invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: safr_ci
          POSTGRES_PASSWORD: safr_ci
          POSTGRES_DB: safr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safr_ci -d safr_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: "06 Development/backend"
    env:
      ENVIRONMENT: test
      DEBUG: "false"
      SQL_ECHO: "false"
      DATABASE_URL: postgresql+psycopg://safr_ci:safr_ci@127.0.0.1:5432/safr_ci
      SAFR_TEST_POSTGRES_URL: postgresql+psycopg://safr_ci:safr_ci@127.0.0.1:5432/safr_ci
      SERVICE_API_TOKEN: ci-service-token
      ADMIN_API_TOKEN: ci-admin-token
      TELEGRAM_BOT_TOKEN: 123456:ci-token
      TELEGRAM_BOT_USERNAME: safr_ci_bot
      DEFAULT_ADMIN_TELEGRAM_ID: "1"
      MINI_APP_ORIGINS: https://app.safrway.online
      WEBSITE_URL: https://safrway.online
      APPLICATION_URL: https://app.safrway.online
      MINI_APP_COOKIE_SECURE: "true"
      WEB_COOKIE_SECURE: "true"
      BALI_TEST_POSTGRES_BIN: /usr/lib/postgresql/16/bin
      BALI_TEST_NGINX_BIN: /usr/sbin/nginx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "06 Development/backend/requirements.lock.txt"
      - name: Install backend dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock.txt
          python -m pip install pytest==8.3.5
          python -m pip check
          python -m compileall -q app
      - name: Install owned-cluster readiness test tools
        run: |
          if [ ! -x "$BALI_TEST_POSTGRES_BIN/pg_ctl" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-16
          fi
          test -x "$BALI_TEST_POSTGRES_BIN/initdb"
          test -x "$BALI_TEST_POSTGRES_BIN/pg_ctl"
      - name: Verify and apply migrations to CI PostgreSQL
        run: |
          test "$(python -m alembic heads | wc -l | tr -d ' ')" = "1"
          python -m alembic upgrade head
      - name: Install isolated proxy-boundary test tools
        run: |
          if [ ! -x "$BALI_TEST_NGINX_BIN" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends nginx
          fi
          test -x "$BALI_TEST_NGINX_BIN"
          "$BALI_TEST_NGINX_BIN" -V 2>&1 | grep -q -- '--with-http_realip_module'
      - name: Require all 33 UI10 tests on a fresh owned socket-only PostgreSQL
        run: |
          python tests/run_ui10_owned_postgres.py --junitxml /tmp/ui10-owned-proof.xml --receipt /tmp/ui10-owned-receipt.json
          python -c 'import json; r=json.load(open("/tmp/ui10-owned-receipt.json")); assert r["status"]=="PASS" and r["expected_test_count"]==33 and all(r[k] for k in ("identity_verified","tests_passed","cluster_stop_verified","directory_cleanup_verified"))'
      - name: Run remaining backend tests including PostgreSQL races
        # These exact two modules execute all33 cases in the required lane
        # above. Never point their private Unix-socket guard at the CI TCP DB.
        run: python -m pytest -q --ignore=tests/test_client_ui_preference.py --ignore=tests/test_mini_client_ui_preference.py --junitxml=/tmp/backend-postgres-proof.xml
      - name: Require owned messaging and finite visa-agent PostgreSQL gates without skips
        run: |
          python -c 'import xml.etree.ElementTree as E; root=E.parse("/tmp/backend-postgres-proof.xml").getroot(); cases=[c for c in root.iter("testcase") if "test_bot_messaging_postgres" in c.get("classname", "")]; assert len(cases)==2 and all(c.find("skipped") is None and c.find("failure") is None and c.find("error") is None for c in cases), "Both owned messaging PostgreSQL gates must PASS, not SKIP"'
          python - <<'PY'
          import xml.etree.ElementTree as E
          root = E.parse("/tmp/backend-postgres-proof.xml").getroot()
          required = {
              "test_first_binding_two_credentials_and_different_keys_cannot_create_duplicate",
              "test_inflight_revoke_and_case_cas_have_ordered_commit_retry_without_lost_update",
              "test_actual_additive_upgrade_preserves_old_columns_on_postgres",
              "test_issued_document_race_and_replay_postgres",
              "test_protected_file_follows_known_and_unknown_commit_outcomes",
              "test_issued_grant_migration_keeps_old_rows_and_refuses_destructive_downgrade",
          }
          rows = [row for row in root.iter("testcase") if row.get("classname", "").endswith("test_visa_agent_postgres")]
          assert len(rows) == len(required) and {row.get("name") for row in rows} == required
          assert all(row.find(tag) is None for row in rows for tag in ("skipped", "failure", "error"))
          print("Visa-agent PostgreSQL PASS:", *sorted(required), sep="\n")
          PY
          python - <<'PY'
          import xml.etree.ElementTree as E
          root=E.parse('/tmp/backend-postgres-proof.xml').getroot()
          groups=[('Guest PostgreSQL', 'test_guest_chat_postgres', {
              'test_concurrent_first_messages_share_one_conversation',
              'test_same_key_retry_is_single_write_and_revoke_orders_before_replay',
              'test_actual_guest_migration_preserves_old_chat_rows'}),
              ('Native Nginx', 'RealProxyBoundaryTests', {
              'test_every_production_proxy_location_passes_resolved_identity',
              'test_guest_messages_deny_get_with_private_cache_policy',
              'test_protected_upload_accepts_application_limit_and_other_routes_keep_smaller_limit'}),
              ('Mini App PostgreSQL', 'test_mini_app_session_postgres', {
              'test_one_verified_proof_has_only_one_committed_session_on_postgres',
              'test_logout_revokes_refresh_rotation_that_commits_first_on_postgres'})]
          for label,classname,names in groups:
              cases=[c for c in root.iter('testcase') if c.get('classname','').split('.')[-1]==classname and c.get('name') in names]
              assert len(cases)==len(names) and {c.get('name') for c in cases}==names and all(c.find(k) is None for c in cases for k in ('skipped','failure','error')), label+' must PASS without skips'
              print(label+' PASS:', *sorted(names), sep='\n')
          PY
      - name: Require Yoga PostgreSQL upgrade, concurrency and real restore proof
        run: |
          python -m pytest -q tests/test_yoga_channel_migration.py -k postgres --junitxml=/tmp/yoga-postgres-proof.xml
          python -c 'import xml.etree.ElementTree as E; root=E.parse("/tmp/yoga-postgres-proof.xml").getroot(); cases=list(root.iter("testcase")); assert len(cases)==3 and all(c.find("skipped") is None and c.find("failure") is None and c.find("error") is None for c in cases), "All three owned PostgreSQL Yoga gates must PASS, not SKIP"'

  target-frontends:
    name: Public Astro, React and ecosystem contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Explicit public-byte contract, NOT original-source equivalence. The
      # separate fixed240 private-original gate is still mandatory for release.
      SAFR_EDITORIAL_VERIFICATION_CONTRACT: PUBLIC_DERIVATIVE
      # Native client source receipts stay local; same-commit private release
      # proof remains mandatory in addition to this public runtime profile.
      SAFR_CLIENT_TEST_CONTRACT: PUBLIC_DERIVATIVE
    defaults:
      run:
        working-directory: "06 Development"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Current pinned LTS: stable glob and upstream dependency-warning semantics.
          node-version: "24.19.0"
      # Install through the official action; never bypass Corepack signatures.
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
          run_install: false
      - name: Verify pinned frontend toolchain
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(pnpm --version)" = "11.9.0"
      - name: Install target frontend dependencies
        run: |
          pnpm --dir react-app install --frozen-lockfile
          pnpm --dir astro-site install --frozen-lockfile
      - name: Validate shared contracts
        run: |
          node astro-site/scripts/verify-editorial-contract.mjs --contract PUBLIC_DERIVATIVE
          pnpm --dir shared validate
          pnpm --dir shared test
      - name: Test React application contract
        run: pnpm --dir react-app test:public
      - name: Test Astro public contract
        run: pnpm --dir astro-site test
      - name: Verify isolated Yoga Ganster preview and package
        run: |
          pnpm --dir react-app exec tsc -p tsconfig.york-preview.json
          pnpm --dir astro-site build:york-preview
          pnpm --dir astro-site test:york-preview
          pnpm --dir astro-site package:york-preview
          pnpm --dir astro-site build:yoga-https-preview
          pnpm --dir astro-site test:yoga-https-preview
          pnpm --dir astro-site package:yoga-https-preview
      - name: Install CI Chromium
        run: pnpm --dir astro-site exec playwright install --with-deps chromium
      - name: Export CI Chromium path
        run: |
          echo "CHROME_PATH=$(cd astro-site && node -e 'console.log(require("@playwright/test").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Test browser navigation and accessibility
        run: |
          pnpm --dir react-app test:browser
          pnpm --dir astro-site test:browser
      - name: Test Lighthouse budgets
        run: pnpm --dir astro-site test:lighthouse
      - name: Preserve frontend verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-verification-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            06 Development/react-app/test-results/
            06 Development/astro-site/test-results/
            06 Development/astro-site/.lighthouseci/

  reference-next-vinext:
    name: Next and Vinext reference parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public build constants, not credentials. The validator must stay enabled.
      NEXT_PUBLIC_SITE_URL: https://safrway.online
      NEXT_PUBLIC_API_BASE_URL: https://api.safrway.online
    defaults:
      run:
        working-directory: "06 Development/web"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
          run_install: false
      - name: Verify pinned frontend toolchain
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(pnpm --version)" = "11.9.0"
      - name: Install reference dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Next and Vinext parity gates
        run: pnpm test
