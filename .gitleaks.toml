  "^\\s*assert\\ check\\.query\\(VisaEvent\\)\\.filter_by\\(idempotency_key=\"publish\\-fixture\\-0001\"\\)\\.count\\(\\)\\ ==\\ 1\\s*$",
  "^\\s*assignment_idempotency_key=\"aggregate\\-assignment\\-key\\-0001\"\\)\\s*$",
