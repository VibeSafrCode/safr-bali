  "^\\s*payload\\ =\\ api\\.PublicationRequest\\(notify_client=True,\\ reason=\"Fixture\\ publish\",\\ idempotency_key=\"publish\\-fixture\\-0001\"\\)\\s*$",
  "^\\s*payload\\ =\\ visa_api\\.VisaAssignmentRequest\\(assigned_admin_id=second\\.id,\\ expected_version=1,\\ reason=\"Reassign\\ fixture\",\\ idempotency_key=\"assignment\\-fixture\\-1\"\\)\\s*$",
